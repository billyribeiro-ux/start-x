[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "startx"
version = "0.1.0"
description = "Self-learning swing-trading research engine (causal attribution + event study) on FMP data"
requires-python = ">=3.11"
# Phase-1 runtime deps (the engine + dashboard). Heavier ML libs live in requirements-ml.txt.
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "streamlit>=1.33",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
