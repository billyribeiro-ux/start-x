[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "startx"
version = "0.1.0"
description = "Self-learning swing-trading research engine (causal attribution + event study) on FMP data"
requires-python = ">=3.11"
# Phase-1 runtime deps (the engine + dashboard). Heavier ML libs live in requirements-ml.txt.
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "streamlit>=1.33",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# qedge scanner stack (exact pins mirror requirements-qedge.txt for reproducibility).
qedge = [
    "scikit-learn==1.5.2",
    "lightgbm==4.5.0",
    "shap==0.46.0",
    "hmmlearn==0.3.2",
    "river==0.21.2",
    "ruptures==1.1.9",
    "joblib==1.4.2",
    "optuna==3.6.1",
    "mypy==1.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Strict typing is enforced for qedge only. The reused startx package is treated
# as an external untyped dependency (follow_imports=skip) so its lack of strict
# annotations does not leak into qedge's gate; disallow_untyped_calls is the one
# strict flag relaxed, since qedge legitimately calls untyped startx functions.
[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_calls = false
files = ["src/qedge"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "startx.*",
    "pandas",
    "pandas.*",
    "scipy.*",
    "numba.*",
    "matplotlib.*",
    "hmmlearn.*",
    "river.*",
    "ruptures.*",
    "shap.*",
    "lightgbm.*",
    "sklearn.*",
    "statsmodels.*",
    "joblib.*",
]
ignore_missing_imports = true
follow_imports = "skip"
