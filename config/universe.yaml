# Trading universe. Each symbol maps a display ticker -> FMP symbol + type.
# type drives attribution: "stock" gets company catalysts (earnings/grades/insider);
# "index_etf" gets macro catalysts (econ calendar, VIX, gap/volume) only.
benchmark: "^GSPC"   # market model benchmark for single-stock abnormal returns

symbols:
  SPY:  { fmp: "SPY",    type: index_etf, name: "SPDR S&P 500 ETF" }
  SPX:  { fmp: "^GSPC",  type: index_etf, name: "S&P 500 Index" }
  QQQ:  { fmp: "QQQ",    type: index_etf, name: "Invesco QQQ (Nasdaq 100)" }
  IWM:  { fmp: "IWM",    type: index_etf, name: "iShares Russell 2000 ETF" }
  TSLA: { fmp: "TSLA",   type: stock,     name: "Tesla Inc." }
  NVDA: { fmp: "NVDA",   type: stock,     name: "NVIDIA Corp." }
  AAPL: { fmp: "AAPL",   type: stock,     name: "Apple Inc." }

# Extra series pulled for context (not traded). Warmed into data/cache/prices/<file>.parquet by
# backfill; the on-disk filename is the FMP symbol sanitized (^ -> _), so ^VIX -> _VIX.parquet,
# ^VVIX -> _VVIX.parquet, GLD -> GLD.parquet — exactly what run_book.py loads.
context:
  VIX:  { fmp: "^VIX",  name: "CBOE Volatility Index" }
  VVIX: { fmp: "^VVIX", name: "CBOE VVIX (vol-of-vol)" }
  GLD:  { fmp: "GLD",   name: "SPDR Gold Shares ETF" }
